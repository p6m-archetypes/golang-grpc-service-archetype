syntax = "proto3";

package {{ prefix_name }}.{{ suffix_name }}.v1;

option go_package = "{{ module_path }}/gen/{{ prefix_name }}_{{ suffix_name }}/v1;{{ prefix_name }}{{ suffix_name }}v1";

service {{ PrefixName }}{{ SuffixName }} {
  rpc Create{{ PrefixName }} (Create{{ PrefixName }}Request) returns ({{ PrefixName }}Response);
  rpc Get{{ PrefixName }} (Get{{ PrefixName }}Request) returns ({{ PrefixName }}Response);
  rpc List{{ PrefixName }}s (List{{ PrefixName }}sRequest) returns (List{{ PrefixName }}sResponse);
}

message {{ PrefixName }}Response {
  string id = 1;
  string display_name = 2;
}

message Create{{ PrefixName }}Request {
  string display_name = 1;
}

message Get{{ PrefixName }}Request {
  string id = 1;
}

message List{{ PrefixName }}sRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message List{{ PrefixName }}sResponse {
  repeated {{ PrefixName }}Response items = 1;
  string next_page_token = 2;
}
